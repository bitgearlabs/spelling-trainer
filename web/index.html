<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling Trainer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#1e2340; --muted:#6b7194; --line:#e3e7f5; --bg:#f5f7ff;
  --blue:#3b82f6; --violet:#8b5cf6; --pink:#ec4899; --amber:#f59e0b; --green:#10b981; --cyan:#06b6d4;
  --ok:#10b981; --bad:#ef4444;
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:
   radial-gradient(600px 400px at 8% 0%,#dbe7ff 0,transparent 70%),
   radial-gradient(600px 400px at 100% 10%,#fde3f3 0,transparent 70%),
   radial-gradient(700px 500px at 50% 110%,#d9f7ec 0,transparent 70%),var(--bg);
  padding:28px 16px 60px}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--violet) 55%,var(--pink));box-shadow:0 8px 20px #8b5cf655}
h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
header p{color:var(--muted);font-size:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:24px;margin-bottom:18px;
  box-shadow:0 10px 30px #3b3f8f14}
.rainbow{border:3px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,
  linear-gradient(120deg,var(--blue),var(--violet),var(--pink),var(--amber),var(--green),var(--cyan)) border-box}
h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
h2 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cat{--c:var(--blue);position:relative;text-align:left;cursor:pointer;background:#fff;font:inherit;color:inherit;
  border:2px solid color-mix(in srgb,var(--c) 35%,white);border-radius:16px;padding:14px 14px 14px 16px;
  transition:.15s;opacity:.55}
.cat:hover{transform:translateY(-2px);opacity:.9}
.cat.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,white);
  box-shadow:0 6px 16px color-mix(in srgb,var(--c) 28%,transparent)}
.cat .ic{font-size:24px}
.cat b{display:block;margin-top:4px;font-size:15px}
.cat small{color:var(--muted);font-size:12.5px}
.cat code{display:block;margin-top:6px;font-size:12px;color:var(--c);font-weight:600}
.cat .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--c);
  color:#fff;font-size:13px;display:none;place-items:center}
.cat.on .tick{display:grid}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.seg{display:inline-flex;background:#eef1fb;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--muted);
  padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #3b3f8f22}
.seg button:disabled{opacity:.4;cursor:not-allowed}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
select{font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:260px;max-width:100%}
select:focus,input:focus{outline:none;border-color:var(--violet)}
input[type=range]{accent-color:var(--violet);width:220px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:600}
.switch input{display:none}
.switch i{width:44px;height:25px;border-radius:99px;background:#d6dbef;position:relative;transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i:after{left:22px}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:14px;padding:13px 22px;cursor:pointer;transition:.15s;
  background:#eef1fb;color:var(--ink)}
.btn:hover{transform:translateY(-1px);background:#e4e8f8}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.pri{color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 8px 18px #6d5cf74d}
.btn.pri:hover{background:linear-gradient(135deg,#2f74ea,#7d4de8)}
.btn.big{padding:16px 34px;font-size:17px;width:100%}
.hidden{display:none!important}
.sp{font:inherit;font-weight:700;width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.sp:hover{border-color:var(--violet);background:#f4f0ff}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
/* quiz */
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.bar{flex:1;height:12px;border-radius:99px;background:#e6eaf8;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .4s;
  background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink))}
.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:#fff;border:2px solid var(--line);white-space:nowrap}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;color:var(--c);
  background:color-mix(in srgb,var(--c) 12%,white);border:2px solid var(--c)}
.stage{text-align:center;padding:6px 0}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.playwrap{position:relative;width:120px;height:120px;margin:22px auto 8px}
.play{position:relative;z-index:2;width:120px;height:120px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:44px;
  background:linear-gradient(135deg,var(--blue),var(--violet) 60%,var(--pink));box-shadow:0 12px 28px #7c5cf75c;transition:.15s}
.play:hover{transform:scale(1.05)}
.play:disabled{filter:grayscale(.6);opacity:.6;cursor:not-allowed;transform:none}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--violet);opacity:0}
.playing .ring{animation:pulse 1.4s infinite}
.playing .ring:nth-child(2){animation-delay:.45s}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}
.status{font-size:14px;color:var(--muted);min-height:20px;font-weight:600}
.answer{width:100%;font:inherit;font-size:26px;font-weight:700;text-align:center;letter-spacing:1.5px;padding:16px;
  border:3px solid var(--line);border-radius:18px;margin-top:18px;color:var(--ink);background:#fbfcff}
.answer.ok{border-color:var(--ok);background:#ecfdf5}
.answer.bad{border-color:var(--bad);background:#fef2f2}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.fb{margin-top:16px;border-radius:16px;padding:14px 18px;font-weight:700;text-align:center;font-size:17px}
.fb.ok{background:#ecfdf5;color:#047857;border:2px solid #a7f3d0}
.fb.bad{background:#fef2f2;color:#b91c1c;border:2px solid #fecaca}
.fb small{display:block;font-weight:500;margin-top:4px;font-size:14px;opacity:.85}
.keys{color:var(--muted);font-size:12.5px;text-align:center;margin-top:14px}
kbd{background:#eef1fb;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:12px}
/* results */
.score{width:170px;height:170px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;
  background:conic-gradient(var(--green) calc(var(--p)*1%),#e6eaf8 0)}
.score div{width:134px;height:134px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:38px;font-weight:800}
.score small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.res{display:grid;grid-template-columns:150px 1fr 56px;gap:12px;align-items:center;margin:10px 0;font-size:14px;font-weight:600}
.res .t{height:14px;border-radius:99px;background:#eef1fb;overflow:hidden}
.res .t i{display:block;height:100%;border-radius:99px;background:var(--c)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2340;color:#fff;padding:12px 20px;
  border-radius:12px;font-weight:600;font-size:14px;z-index:9;max-width:90vw}
@media(max-width:560px){.res{grid-template-columns:110px 1fr 46px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎧</div>
    <div><h1>Spelling Trainer</h1><p>Listen carefully, type exactly what you hear.</p></div>
  </header>

  <!-- SETUP -->
  <section id="setup">
    <div class="card rainbow">
      <h2><span class="n">1</span> Choose what to practise</h2>
      <div class="grid" id="cats"></div>
    </div>

    <div class="card rainbow">
      <h2><span class="n">2</span> Choose your voice</h2>
      <label class="f" style="margin-top:0">Speech engine</label>
      <div class="seg" id="engines"></div>
      <label class="f">Voice / accent</label>
      <div class="row">
        <select id="voice"></select>
        <button class="btn" id="test">🔈 Test voice</button>
      </div>
      <label class="f">Speed: <span id="speedv">1.00×</span></label>
      <input type="range" id="speed" min="0.6" max="1.3" step="0.05" value="1">
      <label class="f">Say "double / triple" for repeated digits</label>
      <div class="seg" id="dbl"></div>
      <label class="f">Say the digit 0 as</label>
      <div class="seg" id="zero"></div>
      <label class="f">Hard mode</label>
      <label class="switch"><input type="checkbox" id="hard"><i></i>
        <span>Letters O and I in codes <small style="color:var(--muted);font-weight:500">("oh" may be the letter O or the digit 0)</small></span></label>
      <details style="margin-top:18px">
        <summary style="cursor:pointer;font-weight:700;font-size:14px">🔎 Letter &amp; digit check <small style="color:var(--muted);font-weight:500">— click to hear how the selected voice says each one</small></summary>
        <div class="row" id="spellgrid" style="gap:8px;margin-top:12px"></div>
      </details>
    </div>

    <div class="card rainbow">
      <h2><span class="n">3</span> Session options</h2>
      <div class="row" style="justify-content:space-between">
        <div>
          <label class="f" style="margin-top:0">Number of questions</label>
          <div class="seg" id="count"></div>
        </div>
        <label class="switch"><input type="checkbox" id="exam"><i></i>
          <span>Exam mode <small style="color:var(--muted);font-weight:500">(listen only once)</small></span></label>
      </div>
    </div>
    <button class="btn pri big" id="start">Start practice →</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="top">
      <span class="pill" id="qn">Question 1/10</span>
      <div class="bar"><i id="prog"></i></div>
      <span class="pill" id="sc">✔ 0</span>
    </div>
    <div class="card rainbow">
      <div class="stage">
        <span class="badge" id="badge"></span>
        <div class="hint" id="hint"></div>
        <div class="playwrap" id="pw"><div class="ring"></div><div class="ring"></div>
          <button class="play" id="play" title="Play / replay">▶</button></div>
        <div class="status" id="status"></div>
      </div>
      <input class="answer" id="ans" autocomplete="off" spellcheck="false" placeholder="Type your answer here…">
      <div class="actions">
        <button class="btn pri" id="check">Check answer</button>
        <button class="btn" id="next" disabled>Next question →</button>
      </div>
      <div id="fb"></div>
      <div class="keys"><kbd>Enter</kbd> check / next &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>Space</kbd> replay</div>
    </div>
    <button class="btn" id="quit">← Back to setup</button>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card rainbow" style="text-align:center">
      <h2 style="justify-content:center">🎉 Session complete</h2>
      <div class="score" id="ring"><div><span id="pct"></span></div></div>
      <p id="sum" style="font-weight:700;margin-bottom:18px"></p>
      <div style="text-align:left" id="bycat"></div>
      <div class="row" style="margin-top:22px;justify-content:center">
        <button class="btn pri" id="again">Practise again</button>
        <button class="btn" id="home">Change settings</button>
      </div>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const CATS={
  phone:{c:'--blue',ic:'📞',t:'Phone Numbers',d:'Digits, double / triple, big numbers',e:'07911 123 456'},
  code:{c:'--violet',ic:'🏷️',t:'Postcodes & Codes',d:'Letters and digits, spelled out',e:'SW1A 2AA · BK-48291'},
  name:{c:'--pink',ic:'🔤',t:'Names & Streets',d:'Spelled letter by letter',e:'Wolverhampton Road'},
  date:{c:'--amber',ic:'📅',t:'Dates & Ordinals',d:'Day, month, 1st / 22nd / 31st',e:'Tuesday 22 March'},
  money:{c:'--green',ic:'💷',t:'Currency',d:'£ $ € with pence / cents',e:'£1,250.50'},
  measure:{c:'--cyan',ic:'📏',t:'Measurements',d:'Distance, weight, volume, %',e:'2.5 km · 30 cm'}
};
let S=Object.assign({engine:'edge',voice:'en-GB-SoniaNeural',speed:1,count:10,exam:false,double:'auto',zero:'random',hard:false,
  cats:Object.keys(CATS)},JSON.parse(localStorage.getItem('spelltrainer')||'{}'));
const save=()=>localStorage.setItem('spelltrainer',JSON.stringify(S));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)};
const api=(u,b)=>fetch(u,b?{method:'POST',body:JSON.stringify(b)}:{});
const show=id=>['setup','quiz','results'].forEach(s=>$(s).classList.toggle('hidden',s!==id));

/* ---- setup ---- */
function renderCats(){
  $('cats').innerHTML='';
  for(const [k,v] of Object.entries(CATS)){
    const b=document.createElement('button');b.className='cat'+(S.cats.includes(k)?' on':'');
    b.style.setProperty('--c',`var(${v.c})`);
    b.innerHTML=`<span class="tick">✓</span><span class="ic">${v.ic}</span><b>${v.t}</b><small>${v.d}</small><code>${v.e}</code>`;
    b.onclick=()=>{S.cats=S.cats.includes(k)?S.cats.filter(x=>x!==k):[...S.cats,k];b.classList.toggle('on');save()};
    $('cats').appendChild(b);
  }
}
async function renderEngines(){
  const list=await (await api('/api/engines')).json();
  const box=$('engines');box.innerHTML='';
  if(!list.find(e=>e.key===S.engine&&e.available))S.engine=(list.find(e=>e.available)||list[0]).key;
  list.forEach(e=>{const b=document.createElement('button');b.textContent=e.label+(e.available?'':' (not installed)');
    b.disabled=!e.available;b.className=e.key===S.engine?'on':'';
    b.onclick=()=>{S.engine=e.key;S.voice='';save();renderEngines()};box.appendChild(b)});
  await loadVoices();
}
async function loadVoices(){
  const sel=$('voice');sel.innerHTML='<option>Loading…</option>';
  const r=await api('/api/voices?engine='+S.engine);
  if(!r.ok){sel.innerHTML='<option value="">Default</option>';return}
  const v=await r.json();sel.innerHTML='';
  v.forEach(x=>sel.add(new Option(x.name,x.id)));
  if(v.find(x=>x.id===S.voice))sel.value=S.voice;else{S.voice=v[0]?v[0].id:'';sel.value=S.voice}
  save();
}
$('voice').onchange=e=>{S.voice=e.target.value;save()};
$('speed').value=S.speed;$('speedv').textContent=S.speed.toFixed(2)+'×';
$('speed').oninput=e=>{S.speed=+e.target.value;$('speedv').textContent=S.speed.toFixed(2)+'×';save()};
function seg(id,opts,key){
  const box=$(id);box.innerHTML='';
  opts.forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.className=S[key]===v?'on':'';
    b.onclick=()=>{S[key]=v;save();[...box.children].forEach(x=>x.classList.toggle('on',x===b))};box.appendChild(b)});
}
seg('dbl',[['auto','Auto (by accent)'],['always','Always'],['never','Never']],'double');
seg('zero',[['random','Random'],['oh','"oh"'],['zero','"zero"']],'zero');
$('hard').checked=S.hard;$('hard').onchange=e=>{S.hard=e.target.checked;save()};
'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('').forEach(ch=>{const b=document.createElement('button');
  b.className='sp';b.textContent=ch;
  b.onclick=async()=>{try{player.src=await fetchAudio({spell:ch});await player.play()}catch(e){toast(e.message)}};
  $('spellgrid').appendChild(b)});
$('exam').checked=S.exam;$('exam').onchange=e=>{S.exam=e.target.checked;save()};
[5,10,20,30,50].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n===S.count?'on':'';
  b.onclick=()=>{S.count=n;save();[...$('count').children].forEach(x=>x.classList.toggle('on',+x.textContent===n))};$('count').appendChild(b)});

let player=new Audio();
async function fetchAudio(body){
  const r=await api('/api/tts',Object.assign({engine:S.engine,voice:S.voice,speed:S.speed},body));
  if(!r.ok){let m='Could not generate speech';try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
  return URL.createObjectURL(await r.blob());
}
$('test').onclick=async()=>{
  $('test').disabled=true;
  try{player.src=await fetchAudio({text:'Oh seven nine double one, three four five, six seven eight.'});await player.play()}
  catch(e){toast(e.message)}
  $('test').disabled=false;
};

/* ---- quiz ---- */
let Q=null,asked=0,right=0,stats={},plays=0,answered=false,playing=false,audioCache={};
$('start').onclick=()=>{
  if(!S.cats.length){toast('Select at least one practice type.');return}
  asked=0;right=0;stats={};show('quiz');nextQ();
};
async function nextQ(){
  if(asked>=S.count){return finish()}
  const r=await api('/api/question',{cats:S.cats,engine:S.engine,voice:S.voice,double:S.double,zero:S.zero,hard:S.hard});Q=await r.json();
  player.pause();playing=false;$('pw').classList.remove('playing');
  asked++;plays=0;answered=false;audioCache={};
  const v=CATS[Q.category];
  $('badge').textContent=v.ic+' '+Q.label;$('badge').style.setProperty('--c',`var(${v.c})`);
  $('hint').textContent=Q.hint;
  $('qn').textContent=`Question ${asked}/${S.count}`;
  $('prog').style.width=((asked-1)/S.count*100)+'%';
  $('sc').textContent='✔ '+right;
  const a=$('ans');a.value='';a.className='answer';a.disabled=false;a.focus();
  $('fb').innerHTML='';$('check').disabled=false;$('next').disabled=true;
  $('next').textContent=asked>=S.count?'See results →':'Next question →';
  play();
}
async function play(){
  const q=Q;
  if(!q||playing)return;
  if(S.exam&&plays>=1&&!answered){setStatus('Exam mode: you can listen only once.');return}
  setStatus('Generating audio…');$('play').disabled=true;
  let url=audioCache[q.id];
  if(!url){
    try{url=await fetchAudio({id:q.id})}
    catch(e){if(Q===q){setStatus('Audio error');$('play').disabled=false;toast(e.message)}return}
    audioCache[q.id]=url;
  }
  if(Q!==q)return; // question changed while the audio was being generated
  player.src=url;playing=true;plays++;$('pw').classList.add('playing');setStatus('Listening…');
  try{await player.play()}catch(e){playing=false;$('pw').classList.remove('playing');$('play').disabled=false;setStatus('Click ▶ to listen')}
}
player.onended=player.onerror=()=>{
  playing=false;$('pw').classList.remove('playing');
  const locked=S.exam&&!answered;$('play').disabled=locked;
  setStatus(locked?'Played once — now type your answer.':'Type what you heard, then press Enter.');
};
const setStatus=t=>$('status').textContent=t;
$('play').onclick=play;

async function checkAns(){
  if(!Q||answered)return;
  const val=$('ans').value;
  const r=await (await api('/api/check',{id:Q.id,answer:val})).json();
  answered=true;
  if(!stats[Q.category])stats[Q.category]=[0,0];
  stats[Q.category][1]++;
  if(r.correct){right++;stats[Q.category][0]++}
  $('ans').classList.add(r.correct?'ok':'bad');$('ans').disabled=true;
  $('fb').innerHTML=r.correct
    ?`<div class="fb ok">✔ Correct!<small>${esc(r.answer)}</small></div>`
    :`<div class="fb bad">✘ Not quite<small>You wrote: <b>${esc(val||'—')}</b> &nbsp;·&nbsp; Correct: <b>${esc(r.answer)}</b></small></div>`;
  $('check').disabled=true;$('next').disabled=false;$('next').focus();
  $('sc').textContent='✔ '+right;
  $('prog').style.width=(asked/S.count*100)+'%';
  if(!playing)$('play').disabled=false;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('check').onclick=checkAns;$('next').onclick=nextQ;
$('quit').onclick=()=>{player.pause();playing=false;$('pw').classList.remove('playing');Q=null;show('setup')};
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  if(e.key==='Enter'){e.preventDefault();answered?nextQ():checkAns()}
  else if(e.code==='Space'&&e.ctrlKey){e.preventDefault();play()}
});

/* ---- results ---- */
function finish(){
  Q=null;player.pause();playing=false;show('results');
  const pct=Math.round(right/S.count*100);
  $('ring').style.setProperty('--p',pct);$('pct').innerHTML=`${pct}%<small>${right}/${S.count}</small>`;
  $('sum').textContent=pct>=90?'Excellent work!':pct>=70?'Good job — keep going!':pct>=50?'Getting there — practise more!':'Keep practising, you will improve!';
  $('bycat').innerHTML='';
  for(const [k,[r,t]] of Object.entries(stats)){
    const v=CATS[k],p=Math.round(r/t*100);
    $('bycat').insertAdjacentHTML('beforeend',`<div class="res" style="--c:var(${v.c})"><span>${v.ic} ${v.t}</span><div class="t"><i style="width:${p}%"></i></div><span>${r}/${t}</span></div>`);
  }
}
$('again').onclick=()=>$('start').click();
$('home').onclick=()=>show('setup');

renderCats();renderEngines();
</script>
</body>
</html>
